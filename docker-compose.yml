services:
  postgres:
    image: postgres:16
    container_name: oncopet-postgres
    environment:
      POSTGRES_USER: oncopet
      POSTGRES_PASSWORD: oncopet123
      POSTGRES_DB: oncopet
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: oncopet-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:

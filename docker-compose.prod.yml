# OncoPet em producao (uma maquina com Docker): 3 copias do backend atras do Caddy (load balancer).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Passo a passo completo: docs/DEPLOY_AWS.md

name: oncopet

# Configuracao comum das copias do backend (o "<<: *backend" reaproveita este bloco)
x-backend-env: &backend-env
  DATABASE_URL: postgresql://oncopet:${POSTGRES_PASSWORD}@postgres:5432/oncopet
  MONGODB_URL: mongodb://oncopet:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env.prod}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  # Link do e-mail de "esqueci minha senha" (padrao: https:// + DOMAIN)
  APP_URL: ${APP_URL:-https://${DOMAIN}}
  # Servidor de e-mail. Sem SMTP_HOST o link aparece so no log do backend
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

x-backend: &backend
  build: ./backend
  image: oncopet-backend
  volumes:
    - uploads:/app/app/uploads   # as 3 copias usam a mesma pasta de fotos e laudos
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  depends_on:
    backend1:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oncopet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: oncopet
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncopet -d oncopet"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongodb:
    image: mongo:7
    # Limita o cache do MongoDB: a instancia tem pouca memoria (1 GB)
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: oncopet
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env.prod}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Tres copias iguais do backend. O Caddy (servico web) e o load balancer:
  # reparte as requisicoes entre elas e tira do rodizio a que cair.
  # A backend1 sobe primeiro (cria as tabelas); as outras esperam ela ficar healthy.
  backend1:
    <<: *backend
    hostname: backend1
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend1
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  backend2:
    <<: *backend
    hostname: backend2
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend2

  backend3:
    <<: *backend
    hostname: backend3
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend3

  web:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

# Os dados ficam nestes volumes e sobrevivem a atualizacoes e reinicios
volumes:
  pg_data:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
